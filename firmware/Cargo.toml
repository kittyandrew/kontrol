[package]
name = "kontrol"
version = "0.1.0"
edition = "2024"
publish = false

# One crate, two builds: the Pico (thumbv6m, target_os = "none") and a Linux build of the same app logic
# over a TAP device, which the VM test (tests/vm/wake.nix) runs.
[dependencies]
# embedded-tls 0.18 uses der's SequenceOf/SetOf, which need der's `heapless` feature, and does not enable it.
der = { version = "0.8.0-rc.2", features = ["heapless"] }
embassy-executor = { version = "0.10", features = ["executor-thread"] }
embassy-net = { version = "0.9", features = ["dhcpv4", "dns", "medium-ethernet", "tcp", "udp"] }
embassy-time = "0.5"
embedded-io-async = "0.7" # the Read trait reqwless's body reader implements
heapless = "0.8"
log = "0.4" # the Pico logs over USB serial, the Linux build to stderr
reqwless = { version = "0.14", default-features = false, features = ["embedded-tls"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = "0.6"
static_cell = "2.1"

[target.'cfg(target_os = "none")'.dependencies]
cortex-m-rt = "0.7"
cyw43 = "0.7"
cyw43-pio = "0.10"
embassy-executor = { version = "0.10", features = ["platform-cortex-m"] }
embassy-rp = { version = "0.10", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-usb-logger = "0.6" # log lines as a USB serial port: `cat /dev/ttyACM0` with the Pico in a computer
panic-halt = "1" # then the watchdog, no longer fed, resets the board
# The M0+ has no compare-and-swap, which static_cell needs, and no 64-bit atomics.
portable-atomic = { version = "1", features = ["critical-section"] }

[target.'cfg(not(target_os = "none"))'.dependencies]
critical-section = { version = "1", features = ["std"] }
embassy-executor = { version = "0.10", features = ["platform-std"] }
embassy-net-tuntap = "0.1"
embassy-time = { version = "0.5", features = ["std"] }
portable-atomic = "1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
